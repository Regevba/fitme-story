name: figma-code-connect-publish
# ─────────────────────────────────────────────────────────────────────────────
# DISABLED 2026-06-15. Figma Code Connect requires an Organization/Enterprise
# plan; this account is Pro, so Code Connect is not available. Every real
# publish run failed since 2026-05-10 — on the web side via W14: the
# sign-in / recover mappings target page FRAMES (node 31-3 / 31-106), not
# components, so `figma connect publish` validation aborts the entire publish.
# The auto-trigger is removed so this workflow no longer runs (and no longer
# fails red). It is kept as a manual-only stub to preserve the option of
# re-enabling after a plan upgrade (and after converting the two page-frame
# mappings to components). Re-enablement steps + rationale live in the FT2 repo:
#   docs/design-system/figma-source-of-truth-plan-2026-06-15.md
# ─────────────────────────────────────────────────────────────────────────────
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Code Connect publish is disabled
        run: |
          echo "Figma Code Connect publish is DISABLED."
          echo "Reason: Code Connect requires a Figma Organization/Enterprise plan; this account is Pro."
          echo "Web-side also needs the 31-3 / 31-106 page-frame mappings converted to components (W14) before any re-enable."
