# .github/workflows/lighthouse-ci.yml
#
# Linear FIT-193 — the sole genuine-open item from the Post-v7.9 Phase E
# "PERF-1->6" bucket (next/font + Vercel SpeedInsights + next/image already
# shipped; only Lighthouse/web-vitals reporting was missing).
#
# Advisory: assertions in .lighthouserc.cjs are all `warn`, so this never
# blocks a merge -- it surfaces perf / a11y / best-practices / seo regressions
# for review while budgets calibrate.
#
# Listens for `deployment_status` events fired by Vercel's GitHub integration
# when a preview build finishes -- same idiom as verify-blind-switch.yml. We
# probe the real preview deploy rather than building Next.js in the runner
# (the app is environment-dependent and a CI build would be both slow and a
# poor proxy for real Vercel-served performance).
#
# Also supports manual `workflow_dispatch` runs against production
# (https://fitme-story.vercel.app). Use this to get the real SEO scorecard
# — preview deploys auto-emit `X-Robots-Tag: noindex` which forces
# Lighthouse's `is-crawlable` audit to 0 and drags the SEO category from
# ~1.0 to ~0.63. The preview path suppresses that audit in
# .lighthouserc.cjs; production keeps it enforced. Operator-triggered:
# `gh workflow run lighthouse-ci.yml -f target=production`.
#
# Vercel SSO gates preview URLs; VERCEL_AUTOMATION_BYPASS_SECRET (already a
# repo secret, used by verify-blind-switch.yml) lets Lighthouse past the SSO
# challenge. Reports upload as a PRIVATE artifact (not temporary-public-storage)
# so the bypass context is never published.
#
# Security: every github.event.* value used in shell flows via env: vars with
# shell-quoted access ("$base", "$MANUAL_TARGET"). workflow_dispatch input
# `target` is constrained to a `choice` type with fixed values
# (production|preview) — no free-form text reaches the run script.
# deployment.sha used in actions/checkout is a SHA.

name: lighthouse-ci

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target environment (production = real SEO score; preview = is-crawlable suppressed)'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - preview

permissions:
  contents: read

jobs:
  lighthouse:
    # Trigger conditions:
    #   - deployment_status: only on successful Vercel Preview deploys
    #   - workflow_dispatch: always (operator-initiated)
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Preview')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployed commit (preview) or main (manual)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}

      - name: Build public route list from target URL
        id: urls
        env:
          # Routed via env (not inlined into the run script) + shell-quoted
          # below, per the repo's untrusted-input handling convention.
          PREVIEW_URL: ${{ github.event.deployment_status.target_url }}
          MANUAL_TARGET: ${{ github.event.inputs.target }}
        run: |
          set -e
          if [ "$MANUAL_TARGET" = "production" ]; then
            base="https://fitme-story.vercel.app"
          elif [ "$MANUAL_TARGET" = "preview" ]; then
            # Manual preview run probes the latest preview alias for main.
            base="https://fitme-story-git-main-regevba-3729s-projects.vercel.app"
          else
            base="${PREVIEW_URL%/}"
          fi
          echo "Target base: $base"
          {
            echo "urls<<EOF"
            echo "$base/"
            echo "$base/case-studies"
            echo "$base/case-studies/framework-v7-9-promotion"
            echo "$base/glossary"
            echo "$base/framework"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          # NOTE: /control-room/* is auth-gated (proxy.ts redirects unauthenticated
          # requests to /control-room/sign-in) -- excluded from the public budget run.
          # NOTE: /framework/universe (3D Universe walkthrough) is TEMPORARILY
          # excluded from the URL list (2026-06-06) — the route 404s in
          # production pending animation polish. Re-add when the route
          # un-404's; see src/app/framework/universe/page.tsx for the
          # re-launch checklist.

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: ${{ steps.urls.outputs.urls }}
          configPath: ./.lighthouserc.cjs
          uploadArtifacts: true
          temporaryPublicStorage: false
        env:
          # Bypass header only set on preview targets (production doesn't need it
          # and including it would be a no-op leak). The .lighthouserc.cjs reads
          # this env var conditionally.
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ github.event.inputs.target == 'production' && '' || secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          # Tells .lighthouserc.cjs whether to suppress the preview-only
          # is-crawlable false-positive. Production runs enforce it; preview
          # runs suppress it.
          LIGHTHOUSE_TARGET: ${{ github.event.inputs.target || 'preview' }}
