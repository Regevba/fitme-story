name: integrity

# Runs the framework's write-time gates on every PR commit.
# Ported from FitTracker2 .github/workflows/ci.yml + integrity-cycle.yml on
# 2026-05-09 per user directive "every feature on fitme story must invoke
# full framework". Closes the v7.8.2 cross-repo asymmetry.
#
# Security note: this workflow does not interpolate any github.event.* user-
# controlled inputs into run: commands; secrets are only used to authenticate
# gh. Safe per the GitHub Actions injection guide.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Authenticate gh for PR-citation cache
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh auth status

      - name: State.json schema gates
        run: python3 scripts/check-state-schema.py

      - name: Case-study preflight (BROKEN_PR_CITATION + tier tags)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/check-case-study-preflight.py

      - name: Cycle-time integrity scan
        run: python3 scripts/integrity-check.py

  mdx-render:
    # W15 prevention gate (added 2026-05-21).
    # Compiles every MDX file under content/framework/ + content/04-case-studies/
    # via the same @mdx-js/mdx pipeline used at production build time. Catches
    # the JSX-tag parse-failure class (<digit, <non-letter, <==, <-->, etc.)
    # at PR time instead of at production deploy time.
    # Trigger: fitme-story PR #129 (2026-05-21) shipped `<5 min` in
    # content/framework/dev-guide.md, breaking /framework/dev-guide prerender;
    # production was broken ~3h until hotfix #130. Full pattern docs at
    # .claude/integrity/observed-patterns.md W15 (synced via prebuild).
    # Safety: no untrusted user-input is interpolated into any run: step.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Render scoped MDX
        run: node scripts/check-mdx-render.mjs

  unit-tests:
    # C2 — JS/TS unit test gate (added 2026-05-23, test-coverage-master-plan T6, RICE 200.0).
    # Runs the entire `tsx --test` suite on every PR + push to main.
    # Closes the documented gap where fitme-story had 19+ test files but
    # zero of them ran in CI.
    # Safety: no untrusted user-input is interpolated into any run: step.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test
