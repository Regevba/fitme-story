name: Reverse-sync fitme-story-native state.json to FT2

# Triggered when fitme-story-native features (state_owner: "fitme-story") get
# committed to fitme-story main. Opens a PR against FT2 mirroring the
# state.json with state_owner_sync_origin: "fitme-story-reverse" marker so
# the morphed C-5 (STATE_OWNER_LOCATION_MISMATCH) gate exempts the file.
#
# v7.8.3 Phase 3 (D-1) per FT2 spec
# docs/superpowers/specs/2026-05-11-cross-repo-state-sync-impl-design.md §4.2.
#
# Operator setup (one-time): provision fine-grained PAT at
# https://github.com/settings/tokens?type=beta scoped to Regevba/FitTracker2
# with Contents:write + Pull-requests:write. Add as FT2_REPO_TOKEN repo
# secret in fitme-story. Without the secret, workflow skips silently.

on:
  push:
    branches: [main]
    paths:
      - '.claude/features/**/state.json'
  workflow_dispatch:  # allow manual re-trigger after fixes or for re-runs
    inputs:
      source_commit:
        description: "F13: diff from this commit SHA instead of HEAD~1 (catches files a prior failed/partial run missed). Ignored when full_scan=true."
        required: false
        default: ""
      full_scan:
        description: "F13: scan ALL .claude/features/*/state.json for state_owner=fitme-story (full-repo fallback), ignoring git diff. Use when files were never mirrored."
        required: false
        type: boolean
        default: false

jobs:
  reverse-sync:
    runs-on: ubuntu-latest
    # NOTE on token-presence check: GitHub Actions does NOT support secrets.* at
    # the JOB-level if condition (the workflow file fails to load with a
    # "workflow file issue" error). Token-presence guard is moved into the FIRST
    # step which uses an env-var indirection that DOES work at step level.
    # If FT2_REPO_TOKEN is missing, the token_check step exits 0 cleanly + sets
    # skip=true so subsequent steps no-op (matches the original "skip silently"
    # intent of the job-level if).
    steps:
      - name: Token presence check (skip rest if missing)
        id: token_check
        env:
          HAS_TOKEN: ${{ secrets.FT2_REPO_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "FT2_REPO_TOKEN not provisioned; skipping reverse-sync (no-op)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Checkout fitme-story
        if: steps.token_check.outputs.skip == 'false'
        uses: actions/checkout@v4
        with:
          # F13: full history so HEAD~1 (push), git ls-files (full_scan), and
          # an arbitrary source_commit diff all resolve.
          fetch-depth: 0

      - name: Detect changed fitme-story-native state.json files
        id: detect
        if: steps.token_check.outputs.skip == 'false'
        shell: bash
        env:
          # F13: inputs via env (injection-safe — never interpolated into a command).
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_COMMIT: ${{ github.event.inputs.source_commit }}
          FULL_SCAN: ${{ github.event.inputs.full_scan }}
        run: |
          set -euo pipefail
          # F13: pick the candidate file set by trigger mode.
          #  - push: diff the just-pushed commit (HEAD~1..HEAD).
          #  - workflow_dispatch + full_scan=true  → scan ALL state.json (full-repo fallback).
          #  - workflow_dispatch + source_commit set → diff <source_commit>..HEAD.
          #  - workflow_dispatch (neither) → default to full scan, since HEAD~1 is
          #    meaningless for a manual re-trigger and the intent is "re-sync whatever's unmirrored".
          CANDIDATES=()
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && { [ "${FULL_SCAN:-false}" = "true" ] || [ -z "${SOURCE_COMMIT:-}" ]; }; then
            echo "F13 mode: full-repo scan (workflow_dispatch fallback)"
            while IFS= read -r f; do CANDIDATES+=("$f"); done < <(git ls-files '.claude/features/*/state.json')
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "${SOURCE_COMMIT:-}" ]; then
            # Validate the SHA before using it (injection-safe + clear error).
            if ! git cat-file -e "${SOURCE_COMMIT}^{commit}" 2>/dev/null; then
              echo "::error::F13 source_commit '${SOURCE_COMMIT}' is not a valid commit in this repo"
              exit 1
            fi
            echo "F13 mode: diff from source_commit ${SOURCE_COMMIT}..HEAD"
            while IFS= read -r f; do CANDIDATES+=("$f"); done < <(git diff --name-only "${SOURCE_COMMIT}" HEAD -- '.claude/features/*/state.json' || true)
          else
            echo "F13 mode: push diff HEAD~1..HEAD"
            while IFS= read -r f; do CANDIDATES+=("$f"); done < <(git diff --name-only HEAD~1 HEAD -- '.claude/features/*/state.json' || true)
          fi
          NATIVE_FILES=()
          for f in "${CANDIDATES[@]:-}"; do
            [ -z "$f" ] && continue
            if [ ! -f "$f" ]; then
              continue  # file deleted; skip
            fi
            owner=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1])).get('state_owner',''))" "$f" 2>/dev/null || echo "")
            if [ "$owner" = "fitme-story" ]; then
              NATIVE_FILES+=("$f")
            fi
          done
          if [ ${#NATIVE_FILES[@]} -eq 0 ]; then
            echo "No fitme-story-native state.json modified; skipping reverse-sync"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s\n' "${NATIVE_FILES[@]}" > /tmp/native-files.txt
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "count=${#NATIVE_FILES[@]}" >> "$GITHUB_OUTPUT"
          echo "Detected ${#NATIVE_FILES[@]} fitme-story-native state.json files"
          cat /tmp/native-files.txt

      - name: Checkout FT2
        if: steps.token_check.outputs.skip == 'false' && steps.detect.outputs.skip == 'false'
        uses: actions/checkout@v4
        with:
          repository: Regevba/FitTracker2
          token: ${{ secrets.FT2_REPO_TOKEN }}
          path: ft2-checkout
          fetch-depth: 1

      - name: Mirror state.json files into FT2 with sync_origin marker
        if: steps.token_check.outputs.skip == 'false' && steps.detect.outputs.skip == 'false'
        id: mirror
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          SHORT_SHA="${SOURCE_SHA:0:7}"
          BRANCH="reverse-sync/from-fitme-story/${SHORT_SHA}"
          cd ft2-checkout
          git config user.email "noreply@github.com"
          git config user.name "fitme-story reverse-sync bot"
          git checkout -b "$BRANCH"
          while IFS= read -r src_file; do
            dest_file="${src_file}"
            mkdir -p "$(dirname "$dest_file")"
            python3 - "$src_file" "$dest_file" "$SOURCE_SHA" <<'PYEOF'
          import json, sys
          src_path = f"../{sys.argv[1]}"
          dest_path = sys.argv[2]
          source_sha = sys.argv[3]
          with open(src_path) as f:
              state = json.load(f)
          # Add sync_origin marker fields per spec §4.4
          state["state_owner_sync_origin"] = "fitme-story-reverse"
          state["state_owner_sync_origin_commit"] = source_sha
          state["state_owner_sync_origin_pr_url"] = "pending"  # filled by next step
          with open(dest_path, "w") as f:
              json.dump(state, f, indent=2)
              f.write("\n")
          PYEOF
          done < /tmp/native-files.txt
          git add .
          git commit -m "Reverse-sync: mirror fitme-story-native state.json from ${SHORT_SHA}"
          git push -u origin "$BRANCH"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Open PR against FT2
        if: steps.token_check.outputs.skip == 'false' && steps.detect.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.FT2_REPO_TOKEN }}
          SOURCE_SHA: ${{ github.sha }}
          # Moved from expression context into env to avoid injection risk
          SYNC_COUNT: ${{ steps.detect.outputs.count }}
          SYNC_BRANCH: ${{ steps.mirror.outputs.branch }}
          SHORT_SHA: ${{ steps.mirror.outputs.short_sha }}
        shell: bash
        run: |
          set -euo pipefail
          FILE_LIST=$(sed 's/^/- /' /tmp/native-files.txt)
          cd ft2-checkout
          gh pr create \
            --repo Regevba/FitTracker2 \
            --base main \
            --head "$SYNC_BRANCH" \
            --title "Reverse-sync: ${SYNC_COUNT} fitme-story-native state.json from ${SHORT_SHA}" \
            --body "Auto-PR from fitme-story reverse-sync GitHub Action (v7.8.3 D-1).

          Source commit: https://github.com/Regevba/fitme-story/commit/${SOURCE_SHA}
          Source files (in fitme-story repo):
          ${FILE_LIST}

          Each state.json carries \`state_owner_sync_origin: 'fitme-story-reverse'\` marker.
          Morphed C-5 gate exempts these files from STATE_OWNER_LOCATION_MISMATCH.

          Manual operator merge required per \`feedback_no_auto_merge_without_approval.md\`.

          Generated by reverse-sync-fitme-story-to-ft2 GitHub Action."
